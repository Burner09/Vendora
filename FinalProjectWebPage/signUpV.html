</head>
<body>
    <div id="container">
        <div id="navbar">
            <div id="headImg">
            <img src="images/logoblk.png" alt="Business Logo" height="80"/>
            </div>
            <p class="menu">
                <a href="home.html">Home</a> 
                &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;

            </p>
            <p style="float: right; margin-right: 20px;">
                Business/Name <a href ="profile.html"><img src="images/blankuser.png" width="50"></a>
            </p>
        </div>
        <div id="bannersignUp">
            <br><br>
                <a class = "inactive" href="signUp.html">Customer Sign Up</a> 
                <a class = "SUactive" href="signUpV.html">Vendor Sign Up</a>
                <div id="line"></div>  
        </div>
        <div id="SUcontent">
            <div id="SUform">
                <form>
                    <h2>Personal Identification</h2>
                    <label for="fname">First name:</label>
                    <br>
                    <input type="text" id="fname" name="fname" value="">
                    <br><br>
                    <label for="lname">Last name:</label>
                    <br>
                    <input type="text" id="lname" name="lname" value="">
                    <br><br>
                    <label for="proof_of_identity">Proof of Identity (e.g., Passport, Driver's License):</label>
                    <br>
                    <input type="text" id="proof_of_identity" name="proof_of_identity" value="">
                    <br><br>
                    <label for="country_of_birth">Country of Birth:</label>
                    <br>
                    <input type="text" id="country_of_birth" name="country_of_birth" value="">
                    <br><br>
                    <label for="dob">Date of Birth:</label>
                    <br>
                    <input type="date" id="dob" name="dob" value="">
                    <br><br>
                    <h2>Business Initialization</h2>
                    <label for="business_name">Business Name:</label>
                    <br>
                    <input type="text" id="business_name" name="business_name" value="">
                    <br><br>
                    <label for="business_email">Business Email:</label>
                    <br>
                    <input type="email" id="business_email" name="business_email" value="">
                    <br><br>
                    <label for="business_phone">Telephone:</label>
                    <br>
                    <input type="tel" id="business_phone" name="business_phone" value="">
                    <br><br>
                    <label for="business_address1">Street Address Line 1:</label>
                    <br>
                    <input type="text" id="business_address1" name="business_address1" value="">
                    <br><br>
                    <label for="business_address2">Street Address Line 2:</label>
                    <br>
                    <input type="text" id="business_address2" name="business_address2" value="">
                    <br><br>
                    <label for="business_city">City:</label>
                    <br>
                    <input type="text" id="business_city" name="business_city" value="">
                    <br><br>
                    <label for="business_zip">Postal/Zip Code:</label>
                    <br>
                    <input type="text" id="business_zip" name="business_zip" value="">
                    <br><br>
                    <label for="business_country">Country:</label>
                    <br>
                    <input type="text" id="business_country" name="business_country" value="">
                    <br><br>
                    <label for="business_state">State/Province:</label>
                    <br>
                    <input type="text" id="business_state" name="business_state" value="">
                    <br><br>
                    <label for="business_type">Type of Business:</label>
                    <br>
                    <input type="text" id="business_type" name="business_type" value="">
                    <br><br>
                    <h2>Billing Information</h2>
                    <label for="cc_number">Credit Card Number:</label>
                    <br>
                    <input type="text" id="cc_number" name="cc_number" value="">
                    <br><br>
                    <label for="cardholder_name">Card Holder Name:</label>
                    <br>
                    <input type="text" id="cardholder_name" name="cardholder_name" value="">
                    <br><br>
                    <label for="exp_date">Expiration Date:</label>
                    <br>
                    <input type="month" id="exp_date" name="exp_date" value="">
                    <br><br>
                </form>
            </div>
        </div>
        <div id="footer">
            <br>
            <p style="text-align:center">footer info to be added</p>
        </div>
